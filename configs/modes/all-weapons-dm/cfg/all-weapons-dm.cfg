exec server.cfg

// Minimal plugin-free Valve Deathmatch baseline.
// This is intentionally simple; no legacy Deathmatch/Ranks/skins stack.
game_type 1
game_mode 2
mp_dm_time_between_bonus_max 30
mp_dm_time_between_bonus_min 30
mp_respawn_on_death_ct 1
mp_respawn_on_death_t 1
mp_free_armor 1
mp_weapons_allow_typecount -1
mp_buy_anywhere 1
mp_buytime 9999
mp_teammates_are_enemies 1
mp_autoteambalance 0
mp_limitteams 0
mp_roundtime 15
mp_timelimit 15
mp_maxrounds 999
bot_quota 0
bot_quota_mode normal
bot_join_after_player 1
sv_infinite_ammo 2
ammo_grenade_limit_total 5
mp_warmup_end
css_gamemode all-weapons-dm
say "ZIZO.GG All Weapons DM loaded."
echo "all-weapons-dm.cfg loaded"
