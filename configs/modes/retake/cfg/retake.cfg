exec server.cfg

// Plugin-free Valve Retake baseline.
// Uses CS2's built-in retake skirmish mode before adding any retake plugin.
game_type 0
game_mode 0
sv_skirmish_id 12
sv_visiblemaxplayers 10
mp_autoteambalance 0
mp_limitteams 0
mp_freezetime 5
mp_roundtime 1.92
mp_roundtime_defuse 1.92
mp_maxrounds 30
mp_halftime 1
mp_match_can_clinch 1
mp_buytime 20
mp_buy_anywhere 0
sv_infinite_ammo 0
bot_quota 0
bot_quota_mode normal
bot_join_after_player 1
mp_warmup_end
say "ZIZO.GG Retake baseline loaded."
echo "retake.cfg loaded"
