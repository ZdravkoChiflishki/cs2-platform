apiVersion: apps/v1
kind: Deployment
metadata:
  name: staging-mirage-multicfg-01
  namespace: cs2-servers
  labels:
    app.kubernetes.io/name: cs2-server
    zizo.gg/server-id: staging-mirage-multicfg-01
    zizo.gg/mode: all-weapons-dm
    zizo.gg/region: eu
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cs2-server
      zizo.gg/server-id: staging-mirage-multicfg-01
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cs2-server
        zizo.gg/server-id: staging-mirage-multicfg-01
        zizo.gg/mode: all-weapons-dm
        zizo.gg/region: eu
      annotations:
        zizo.gg/display-name: "All Weapons DM"
        zizo.gg/map: "de_mirage"
        zizo.gg/public-address: "zizogaming.duckdns.org:26001"
    spec:
      serviceAccountName: cs2-server
      nodeSelector:
        kubernetes.io/hostname: k0s-slave5
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: repair-cs2-data-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
          args:
            - chown -R 1000:1000 /home/steam/cs2 2>/dev/null || true
          volumeMounts:
            - name: cs2-data
              mountPath: /home/steam/cs2
      containers:
        - name: cs2
          image: zizobg/cs2-server@sha256:94dcfa9f06352917bce8b5c809b49b396b762d41b8aa36314c5784d6b14973a4
          imagePullPolicy: Always
          stdin: true
          tty: true
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: SERVER_ID
              value: staging-mirage-multicfg-01
            - name: CS2_MODE
              value: all-weapons-dm
            - name: MAP
              value: de_mirage
            - name: PORT
              value: "26001"
            - name: MAXPLAYERS
              value: "24"
            - name: TICKRATE
              value: "128"
            - name: EXEC
              value: all-weapons-dm.cfg
            - name: GAME_TYPE
              value: "1"
            - name: GAME_MODE
              value: "2"
            - name: MAP_GROUP
              value: mg_dm
            - name: CONFIG_ROOT
              value: /opt/cs2-platform/configs
            - name: CS2_ROOT
              value: /home/steam/cs2
            - name: STEAM_UPDATE_POLICY
              value: always
            - name: ENABLE_PLUGIN_RUNTIME
              value: "true"
            - name: CS2_DISABLED_PLUGINS
              value: "CS2-SimpleAdmin,CS2-CustomVotes,GameModeManager,MenuManagerAPI,MenuManagerCore,PlayerSettings"
            - name: CS2_ADMIN_STEAM_IDS
              value: "76561199127257988"
            - name: CS2_ADMIN_FLAGS
              value: "@css/rcon,@css/root"
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cs2-secrets
                  key: RCON_PASSWORD
            - name: STEAM_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: cs2-secrets
                  key: STEAM_ACCOUNT
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: cs2-secrets
                  key: API_KEY
            - name: SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cs2-secrets
                  key: SERVER_PASSWORD
                  optional: true
          ports:
            - name: game-tcp
              containerPort: 26001
              protocol: TCP
            - name: game-udp
              containerPort: 26001
              protocol: UDP
          volumeMounts:
            - name: cs2-data
              mountPath: /home/steam/cs2
            - name: server-config
              mountPath: /opt/cs2-platform/configs/servers/staging-mirage-multicfg-01/cfg
          resources:
            requests:
              cpu: "1000m"
              memory: 2Gi
            limits:
              cpu: "4000m"
              memory: 8Gi
      volumes:
        - name: cs2-data
          persistentVolumeClaim:
            claimName: staging-mirage-multicfg-01-data
        - name: server-config
          configMap:
            name: staging-mirage-multicfg-01-config
